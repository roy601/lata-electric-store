<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lata Electric — trusted electrical &amp; hardware shop in Dhaka. Fans, lights, wires, switches, kitchen appliances and more, with delivery across Bangladesh and cash on delivery." />
  <meta name="theme-color" content="#1E88E5" />
  <!-- Some product photos are hosted on other shops' servers that refuse images shown on other sites;
       not sending the page address makes them load. -->
  <meta name="referrer" content="no-referrer" />
  <meta property="og:site_name" content="Lata Electric" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Lata Electric — Electrical &amp; Hardware Shop in Dhaka" />
  <meta property="og:description" content="Genuine fans, lights, wires, switches and home appliances. Delivery across Bangladesh, cash on delivery." />
  <meta property="og:url" content="https://www.lataelectric.com/" />
  <meta property="og:image" content="https://www.lataelectric.com/images/logo.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/jpeg" href="/images/logo.jpg" />
  <title>Lata Electric — Electrical &amp; Hardware Shop in Dhaka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Light / dark before the first paint (no flash): light unless the visitor chose dark
    (function () {
      var t = 'light';
      try { if (localStorage.getItem('lata-theme') === 'dark') t = 'dark'; } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
      if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161b22');
    })();
  </script>
  <style>
    html[data-theme="dark"], html[data-theme="dark"] body { background: #0d1117; }
    #lata-intro {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      /* Continues the video's own neutral light-grey vignette across the screen */
      background: radial-gradient(circle at center, #f8f8f8 0px, #f1f1f1 80px, #e9e9e9 150px, #e3e3e3 38vmax, #dadada 75vmax);
      transition: opacity .6s cubic-bezier(.4, 0, .2, 1), visibility .6s;
      will-change: opacity;
    }
    #lata-intro.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #lata-intro .intro-media { position: relative; width: 280px; max-width: 60vw; aspect-ratio: 16 / 9; }
    #lata-intro video, #lata-intro .intro-still {
      position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
      display: block; outline: none; pointer-events: none; opacity: 0;
      /* Feather the edges so the video melts into the background (no visible box) */
      -webkit-mask-image: radial-gradient(ellipse 50% 50% at center, #000 55%, transparent 100%);
              mask-image: radial-gradient(ellipse 50% 50% at center, #000 55%, transparent 100%);
      transform: translateZ(0);
      transition: opacity .35s ease, transform .6s cubic-bezier(.4, 0, .2, 1);
    }
    #lata-intro.is-playing video, #lata-intro.is-still .intro-still { opacity: 1; }
    #lata-intro.is-hidden video, #lata-intro.is-hidden .intro-still { transform: scale(1.06); }
    @media (max-width: 600px) {
      #lata-intro .intro-media { width: 200px; max-width: 62vw; }
    }
  </style>
</head>
<body>
  <!-- Intro animation: plays while the homepage pictures load behind it -->
  <div id="lata-intro" aria-hidden="true">
    <div class="intro-media">
      <video muted playsinline preload="auto" src="/intro/lata-intro-v3.mp4"></video>
      <img class="intro-still" src="/intro/lata-intro-end.jpg" alt="" decoding="async" />
    </div>
  </div>
  <script>
    (function () {
      var intro = document.getElementById('lata-intro');
      var path = location.pathname;
      // Shown on the first visit only: a cookie remembers it for 30 days,
      // so returning visitors go straight to the shop.
      var seen = /(?:^|;\s*)lata_intro=1/.test(document.cookie);
      try { seen = seen || sessionStorage.getItem('lata-intro-seen') === '1'; } catch (e) {}

      // Never on the admin panel, never for search-engine robots
      var bot = /bot|crawler|spider|facebookexternalhit|whatsapp|lighthouse|inspectiontool/i.test(navigator.userAgent);
      if (seen || bot || path.indexOf('/admin') === 0) { intro.remove(); return; }
      document.cookie = 'lata_intro=1; max-age=' + 60 * 60 * 24 * 30 + '; path=/; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '');
      try { sessionStorage.setItem('lata-intro-seen', '1'); } catch (e) {}

      var video = intro.querySelector('video');
      var videoDone = false, pageReady = false, closed = false, started = false, still = false;

      function close() {
        if (closed) return;
        closed = true;
        intro.classList.add('is-hidden');
        setTimeout(function () { intro.remove(); }, 650);
      }
      function check() { if (videoDone && pageReady) close(); }

      // Static logo instead of the animation (slow connection, data saver,
      // reduced motion, or autoplay blocked) — never a stuttering video.
      function showStill() {
        if (still || started) return;
        still = true;
        try { video.pause(); video.removeAttribute('src'); video.load(); } catch (e) {}
        intro.classList.add('is-still');
        setTimeout(function () { videoDone = true; check(); }, 900);
      }

      var conn = navigator.connection || {};
      var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (calm || conn.saveData || /(^|-)2g$/.test(conn.effectiveType || '')) {
        showStill();
      } else {
        // Start only when enough is buffered to play straight through
        var go = function () {
          if (started || still) return;
          var p = video.play();
          if (p && p.catch) p.catch(showStill);
        };
        video.addEventListener('canplaythrough', go);
        if (video.readyState >= 4) go();
        video.addEventListener('playing', function () { started = true; intro.classList.add('is-playing'); });
        // hold the finished logo a moment before the page appears
        video.addEventListener('ended', function () { setTimeout(function () { videoDone = true; check(); }, 350); });
        video.addEventListener('error', showStill);
        setTimeout(function () { if (!started) showStill(); }, 2500);
      }

      if (path === '/') {
        if (window.__lataHomeReady) pageReady = true;
        window.addEventListener('lata:home-ready', function () { pageReady = true; check(); });
      } else {
        window.addEventListener('load', function () { pageReady = true; check(); });
      }

      intro.addEventListener('click', close); // tap to skip
      setTimeout(close, 12000);               // safety cap
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
